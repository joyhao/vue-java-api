server:
  port: 9007
  http2:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: joykit-api
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:9006/blog?currentSchema=public
    username: postgres
    password: xinxin
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
app:
  datasource:
    postgres:
      url: jdbc:postgresql://localhost:9006/postgres?currentSchema=public
logging:
  file:
    path: ./logs
  pattern:
    level: '%5p [traceId=%X{traceId:-}]'
springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
