server:
  port: 9007
  http2:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: joykit-api
  config:
    import: optional:classpath:application-local.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 800ms
      additional-paths: src/main/java
    livereload:
      enabled: true
logging:
  file:
    path: ./logs
  pattern:
    level: '%5p [traceId=%X{traceId:-}]'
springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
